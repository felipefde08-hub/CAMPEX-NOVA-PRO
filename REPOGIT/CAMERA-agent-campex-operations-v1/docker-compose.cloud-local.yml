services:
  postgres:
    image: postgres:16-alpine
    container_name: campex-cloud-postgres
    environment:
      POSTGRES_DB: campex_cloud
      POSTGRES_USER: campex
      POSTGRES_PASSWORD: campex_local_dev
    ports:
      - "5432:5432"
    volumes:
      - campex_cloud_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campex -d campex_cloud"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campex_cloud_pgdata:
